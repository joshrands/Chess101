<!-- Chess engine — loaded in both main thread and Web Worker -->
<script src="chessmatrix-scanner.js"></script>
<script id="chess-engine">
'use strict';
// ── Data structures ──────────────────────────────────────────────────────────
class Cell{constructor(r,c){this.row=r;this.col=c;}}
class Team{constructor(r,g,b,name='Wendy'){this.r=r;this.g=g;this.b=b;this.name=name;}}

// ── Piece base ────────────────────────────────────────────────────────────────
class Piece{
  constructor(row,col,team){
    this.row=row;this.col=col;this.team=team;
    this.targets=[];this.critical=false;this.criticalTargets=[];this.touched=false;
  }
  getTargets(){return this.targets;}
  getValue(grid){return this.pieceValue;}
  _bladeRunner(grid,dr,dc,row,col){
    const nr=row+dr,nc=col+dc;
    if(nr<0||nr>7||nc<0||nc>7)return;
    const t=grid[nr][nc];
    if(t===null){this.targets.push(new Cell(nr,nc));this._bladeRunner(grid,dr,dc,nr,nc);}
    else if(t.team.r!==this.team.r)this.targets.push(new Cell(nr,nc));
  }
  _kingsman(grid,row,col,dr,dc){
    if(row<0||row>7||col<0||col>7)return[-1,-1];
    const p=grid[row][col];
    if(p!==null){return p.team.r!==this.team.r?[row,col]:[-1,-1];}
    const nr=row+dr,nc=col+dc;
    if(nr<0||nr>7||nc<0||nc>7)return[-1,-1];
    return this._kingsman(grid,nr,nc,dr,dc);
  }
  criticalMan(){
    if(!this.critical)return;
    const n=[];
    for(const ct of this.criticalTargets)
      for(const t of this.targets)
        if(ct.row===t.row&&ct.col===t.col){n.push(t);break;}
    this.targets=n;
  }
  skyFall(king){
    const n=[];
    for(const t of this.targets)
      for(const s of king.godSaveTheKing)
        if(t.row===s.row&&t.col===s.col){n.push(t);break;}
    this.targets=n;
  }
  move(newRow,newCol,grid){this.row=newRow;this.col=newCol;this.touched=true;return null;}
}

// ── Pawn ─────────────────────────────────────────────────────────────────────
class Pawn extends Piece{
  constructor(row,col,team){
    super(row,col,team);
    this.startingRow=row;this.startingCol=col;
    this.direction=row===6?-1:1; // BUG-01 preserved
    this.enPassantable=false;this.enPassantLoc=null;
    this.pieceValue=5;
  }
  calcTargets(grid){
    this.enPassantLoc=null;this.targets=[];
    if(this.row===0||this.row===7)return;
    const d=this.direction,r=this.row,c=this.col;
    // diagonal captures
    if(c>0){const p=grid[r+d][c-1];if(p&&p.team.r!==this.team.r)this.targets.push(new Cell(r+d,c-1));}
    if(c<7){const p=grid[r+d][c+1];if(p&&p.team.r!==this.team.r)this.targets.push(new Cell(r+d,c+1));}
    // forward
    if(grid[r+d][c]===null){
      this.targets.push(new Cell(r+d,c));
      if(r===this.startingRow&&grid[r+2*d][c]===null)this.targets.push(new Cell(r+2*d,c));
    }
    // en passant
    if(c>0){const n=grid[r][c-1];if(n instanceof Pawn&&n.team.r!==this.team.r&&n.enPassantable){this.targets.push(new Cell(r+d,c-1));this.enPassantLoc=new Cell(r+d,c-1);}}
    if(c<7){const n=grid[r][c+1];if(n instanceof Pawn&&n.team.r!==this.team.r&&n.enPassantable){this.targets.push(new Cell(r+d,c+1));this.enPassantLoc=new Cell(r+d,c+1);}}
    if(this.critical)super.criticalMan();
  }
  skyFall(king){
    const n=[];
    for(const t of this.targets)for(const s of king.godSaveTheKing)if(t.row===s.row&&t.col===s.col){n.push(t);break;}
    if(this.enPassantLoc!==null){
      const loc=this.enPassantLoc;
      const inPre=this.targets.some(t=>t.row===loc.row&&t.col===loc.col);
      const capturedRow=loc.row-this.direction;
      const capturesChecker=king.godSaveTheKing.some(s=>s.row===capturedRow&&s.col===loc.col);
      if(inPre&&capturesChecker)n.push(new Cell(loc.row,loc.col));
    }
    this.targets=n;
  }
  move(newRow,newCol,grid){
    const oldRow=this.row,oldCol=this.col;
    this.row=newRow;this.col=newCol;
    if(oldRow===this.startingRow&&oldCol===this.startingCol&&(newRow-oldRow)===2*this.direction)
      this.enPassantable=true;
    if(this.enPassantLoc!==null&&newRow===this.enPassantLoc.row&&newCol===this.enPassantLoc.col)
      return new Cell(this.enPassantLoc.row-this.direction,this.enPassantLoc.col);
    return null;
  }
  getValue(grid){
    this.calcTargets(grid);
    let v=this.pieceValue+this.targets.length;
    for(const c of this.targets){v++;if((c.row===3||c.row===4)&&(c.col===3||c.col===4))v++;}
    return v;
  }
}

// ── Rook ──────────────────────────────────────────────────────────────────────
class Rook extends Piece{
  constructor(row,col,team){super(row,col,team);this.pieceValue=27;}
  calcTargets(grid){
    this.targets=[];
    this._bladeRunner(grid,1,0,this.row,this.col);
    this._bladeRunner(grid,-1,0,this.row,this.col);
    this._bladeRunner(grid,0,1,this.row,this.col);
    this._bladeRunner(grid,0,-1,this.row,this.col);
    if(this.critical)super.criticalMan();
  }
  getValue(grid){
    this.calcTargets(grid);
    let v=this.pieceValue+this.targets.length;
    for(const c of this.targets)if((c.row===3||c.row===4)&&(c.col===3||c.col===4))v++;
    return v;
  }
}

// ── Bishop ────────────────────────────────────────────────────────────────────
class Bishop extends Piece{
  constructor(row,col,team){super(row,col,team);this.pieceValue=15;}
  calcTargets(grid){
    this.targets=[];
    this._bladeRunner(grid,1,1,this.row,this.col);
    this._bladeRunner(grid,1,-1,this.row,this.col);
    this._bladeRunner(grid,-1,1,this.row,this.col);
    this._bladeRunner(grid,-1,-1,this.row,this.col);
    if(this.critical)super.criticalMan();
  }
  getValue(grid){
    this.calcTargets(grid);
    let v=this.pieceValue+this.targets.length;
    for(const c of this.targets)if((c.row===3||c.row===4)&&(c.col===3||c.col===4))v++;
    return v;
  }
}

// ── Knight ────────────────────────────────────────────────────────────────────
class Knight extends Piece{
  constructor(row,col,team){super(row,col,team);this.pieceValue=13;}
  calcTargets(grid){
    this.targets=[];
    const offs=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
    for(const[dr,dc]of offs){
      const nr=this.row+dr,nc=this.col+dc;
      if(nr<0||nr>7||nc<0||nc>7)continue;
      const p=grid[nr][nc];
      if(p===null||p.team.r!==this.team.r)this.targets.push(new Cell(nr,nc));
    }
    if(this.critical)super.criticalMan();
  }
  getValue(grid){
    this.calcTargets(grid);
    let v=this.pieceValue+this.targets.length;
    for(const c of this.targets)if((c.row===3||c.row===4)&&(c.col===3||c.col===4))v++;
    return v;
  }
}

// ── Queen ─────────────────────────────────────────────────────────────────────
class Queen extends Piece{
  constructor(row,col,team){super(row,col,team);this.pieceValue=49;}
  calcTargets(grid){
    this.targets=[];
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)
      if(dr!==0||dc!==0)this._bladeRunner(grid,dr,dc,this.row,this.col);
    if(this.critical)super.criticalMan();
  }
  getValue(grid){
    this.calcTargets(grid);
    let v=this.pieceValue+this.targets.length;
    for(const c of this.targets)if((c.row===3||c.row===4)&&(c.col===3||c.col===4))v++;
    return v;
  }
}

// ── King ──────────────────────────────────────────────────────────────────────
class King extends Piece{
  constructor(row,col,team){
    super(row,col,team);
    this.direction=row===7?-1:1;
    this.godSaveTheKing=[];
    this.pieceValue=1000;
  }
  _bladeWalker(grid,dr,dc,row,col){
    const nr=row+dr,nc=col+dc;
    if(nr<0||nr>7||nc<0||nc>7)return;
    const p=grid[nr][nc];
    if(p===null||p.team.r!==this.team.r)this.targets.push(new Cell(nr,nc));
  }
  calcTargets(grid){
    this.targets=[];
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)
      if(dr!==0||dc!==0)this._bladeWalker(grid,dr,dc,this.row,this.col);
    // Castling
    if(!this.touched){
      const lr=grid[this.row][this.col-4];
      if(lr instanceof Rook&&!lr.touched&&grid[this.row][this.col-1]===null&&grid[this.row][this.col-2]===null&&grid[this.row][this.col-3]===null)
        this.targets.push(new Cell(this.row,this.col-2));
      const rr=grid[this.row][this.col+3];
      if(rr instanceof Rook&&!rr.touched&&grid[this.row][this.col+1]===null&&grid[this.row][this.col+2]===null)
        this.targets.push(new Cell(this.row,this.col+2));
    }
    const oldRow=this.row,oldCol=this.col;
    let castleLeft=false,castleRight=false,castleLeftStep=true,castleRightStep=true;
    let castleLeftCell=null,castleRightCell=null;
    const toRemove=[];
    for(const cell of this.targets){
      if(cell.row===oldRow&&cell.col===oldCol-2){castleLeft=true;castleLeftCell=cell;}
      if(cell.row===oldRow&&cell.col===oldCol+2){castleRight=true;castleRightCell=cell;}
      const orig=grid[cell.row][cell.col];
      grid[cell.row][cell.col]=this;grid[this.row][this.col]=null;
      this.row=cell.row;this.col=cell.col;
      const[tr,tc]=this.amIGonnaDie(grid);
      if(tr!==-1){
        if(cell.row===oldRow&&cell.col===oldCol-2)castleLeft=false;
        if(cell.row===oldRow&&cell.col===oldCol+2)castleRight=false;
        if(cell.row===oldRow&&cell.col===oldCol-1)castleLeftStep=false;
        if(cell.row===oldRow&&cell.col===oldCol+1)castleRightStep=false;
        toRemove.push(cell);
      }
      grid[oldRow][oldCol]=this;grid[cell.row][cell.col]=orig;
      this.row=oldRow;this.col=oldCol;
    }
    const[ar,ac]=this.amIGonnaDie(grid);
    const inCheck=ar!==-1;
    if(castleLeft&&(inCheck||!castleLeftStep)&&castleLeftCell)toRemove.push(castleLeftCell);
    if(castleRight&&(inCheck||!castleRightStep)&&castleRightCell)toRemove.push(castleRightCell);
    for(const r of toRemove)this.targets=this.targets.filter(t=>!(t.row===r.row&&t.col===r.col));
    return inCheck;
  }
  move(newRow,newCol,grid){
    const oldRow=this.row,oldCol=this.col;
    this.row=newRow;this.col=newCol;this.touched=true;
    if(newRow===oldRow&&newCol===oldCol-2)return[new Cell(oldRow,oldCol-4),new Cell(oldRow,oldCol-1)];
    if(newRow===oldRow&&newCol===oldCol+2)return[new Cell(oldRow,oldCol+3),new Cell(oldRow,oldCol+1)];
    return[null,null];
  }
  getValue(grid){return this.pieceValue;}
  _iSpy(grid,row,col,dr,dc){
    if(row<0||row>7||col<0||col>7)return[-1,-1,-1,-1];
    const p=grid[row][col];
    const nr=row+dr,nc=col+dc,nextOk=nr>=0&&nr<=7&&nc>=0&&nc<=7;
    if(p!==null){
      if(p.team.r!==this.team.r)return[row,col,-1,-1];
      if(nextOk){const[sr,sc]=p._kingsman(grid,nr,nc,dr,dc);return[sr,sc,row,col];}
      return[-1,-1,-1,-1];
    }
    if(nextOk)return this._iSpy(grid,nr,nc,dr,dc);
    return[-1,-1,-1,-1];
  }
  _knightInShiningArmor(grid,dr,dc){
    const nr=this.row+dr,nc=this.col+dc;
    if(nr<0||nr>7||nc<0||nc>7)return[-1,-1];
    const p=grid[nr][nc];
    if(p instanceof Knight&&p.team.r!==this.team.r)return[nr,nc];
    return[-1,-1];
  }
  pleaseGodSaveTheKing(er,ec){
    const[dr,dc]=this._dirFromEnemy(er,ec);
    const cells=[];let r=er,c=ec;
    while(!(Math.round(r)===this.row&&Math.round(c)===this.col)){
      cells.push(new Cell(Math.round(r),Math.round(c)));r+=dr;c+=dc;
    }
    return cells;
  }
  _dirFromEnemy(er,ec){
    if(er===this.row)return[0,-(ec-this.col)/Math.abs(ec-this.col)];
    if(ec===this.col)return[-(er-this.row)/Math.abs(er-this.row),0];
    return[-(er-this.row)/Math.abs(er-this.row),-(ec-this.col)/Math.abs(ec-this.col)];
  }
  amIGonnaDie(grid){
    // Clear friendly critical flags
    for(const row of grid)for(const p of row)if(p&&p.team.r===this.team.r)p.critical=false;
    let ar=-1,ac=-1,attackerCount=0;
    for(let i=-1;i<=1;i++){
      for(let j=-1;j<=1;j++){
        if(i===0&&j===0)continue;
        const[er,ec,sr,sc]=this._iSpy(grid,this.row+i,this.col+j,i,j);
        const orthogonal=(i===0||j===0);
        if(sr!==-1){
          if(er!==-1){
            const ep=grid[er][ec];
            const typeOk=orthogonal?(ep instanceof Rook||ep instanceof Queen):(ep instanceof Bishop||ep instanceof Queen);
            if(typeOk){const sp=grid[sr][sc];if(sp){sp.critical=true;sp.criticalTargets=this.pleaseGodSaveTheKing(er,ec);}}
          }
        } else if(er!==-1){
          const ep=grid[er][ec];
          if(orthogonal){
            if(ep instanceof Rook||ep instanceof Queen){this.godSaveTheKing=this.pleaseGodSaveTheKing(er,ec);ar=er;ac=ec;attackerCount++;}
            else if(ep instanceof King&&Math.abs(er-this.row)+Math.abs(ec-this.col)===1){this.godSaveTheKing=this.pleaseGodSaveTheKing(er,ec);ar=er;ac=ec;attackerCount++;}
          } else {
            if(ep instanceof Bishop||ep instanceof Queen){this.godSaveTheKing=this.pleaseGodSaveTheKing(er,ec);ar=er;ac=ec;attackerCount++;}
            else if(ep instanceof King&&Math.abs(er-this.row)+Math.abs(ec-this.col)===2){this.godSaveTheKing=this.pleaseGodSaveTheKing(er,ec);ar=er;ac=ec;attackerCount++;}
            else if(ep instanceof Pawn&&(er-this.row)===this.direction){this.godSaveTheKing=this.pleaseGodSaveTheKing(er,ec);ar=er;ac=ec;attackerCount++;}
          }
        }
      }
    }
    // Knight checks
    for(const[dr,dc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]){
      const[kr,kc]=this._knightInShiningArmor(grid,dr,dc);
      if(kr!==-1){this.godSaveTheKing=[new Cell(kr,kc)];ar=kr;ac=kc;attackerCount++;break;}
    }
    // Double check: only king moves are legal — no piece can block/capture
    // two attackers at once.  Clear godSaveTheKing so skyFall filters all.
    if(attackerCount>1)this.godSaveTheKing=[];
    return[ar,ac];
  }
}

// ── Board copy ────────────────────────────────────────────────────────────────
function copyPiece(p,teamR,teamL){
  const team=p.team.r===teamR.r?teamR:teamL;
  let c;
  if(p instanceof Pawn){c=new Pawn(p.row,p.col,team);c.startingRow=p.startingRow;c.startingCol=p.startingCol;c.direction=p.direction;c.enPassantable=p.enPassantable;c.enPassantLoc=p.enPassantLoc?new Cell(p.enPassantLoc.row,p.enPassantLoc.col):null;}
  else if(p instanceof King){c=new King(p.row,p.col,team);c.direction=p.direction;}
  else if(p instanceof Queen)c=new Queen(p.row,p.col,team);
  else if(p instanceof Rook)c=new Rook(p.row,p.col,team);
  else if(p instanceof Bishop)c=new Bishop(p.row,p.col,team);
  else c=new Knight(p.row,p.col,team);
  c.touched=p.touched;c.critical=p.critical;c.criticalTargets=[];c.targets=[];
  return c;
}
function deepCopyGrid(grid,teamR,teamL){
  return grid.map(row=>row.map(p=>p?copyPiece(p,teamR,teamL):null));
}

// ── Serialization (for Worker postMessage) ────────────────────────────────────
function serializeGrid(grid){
  return grid.map(row=>row.map(p=>{
    if(!p)return null;
    const t={type:p.constructor.name,row:p.row,col:p.col,tr:p.team.r,tg:p.team.g,tb:p.team.b,touched:p.touched};
    if(p instanceof Pawn){t.startingRow=p.startingRow;t.direction=p.direction;t.enPassantable=p.enPassantable;t.enPassantLoc=p.enPassantLoc?{row:p.enPassantLoc.row,col:p.enPassantLoc.col}:null;}
    if(p instanceof King){t.direction=p.direction;}
    return t;
  }));
}
function deserializeGrid(data,teamR,teamL){
  return data.map(row=>row.map(p=>{
    if(!p)return null;
    const team=p.tr===teamR.r?teamR:teamL;
    let c;
    if(p.type==='Pawn'){c=new Pawn(p.row,p.col,team);c.startingRow=p.startingRow;c.direction=p.direction;c.enPassantable=p.enPassantable;c.enPassantLoc=p.enPassantLoc?new Cell(p.enPassantLoc.row,p.enPassantLoc.col):null;}
    else if(p.type==='King'){c=new King(p.row,p.col,team);if(p.direction!==undefined)c.direction=p.direction;}
    else if(p.type==='Queen')c=new Queen(p.row,p.col,team);
    else if(p.type==='Rook')c=new Rook(p.row,p.col,team);
    else if(p.type==='Bishop')c=new Bishop(p.row,p.col,team);
    else c=new Knight(p.row,p.col,team);
    c.touched=p.touched;c.critical=false;c.criticalTargets=[];c.targets=[];
    return c;
  }));
}

// ── AI tree node ──────────────────────────────────────────────────────────────
class TreeNode{
  constructor(board,oldCell,newCell,teamR,teamL){
    this.boardState=board;this.oldCell=oldCell;this.newCell=newCell;
    this.teamR=new Team(teamR.r,teamR.g,teamR.b);this.teamL=new Team(teamL.r,teamL.g,teamL.b);
    this.children=[];
  }
  addChild(c){this.children.push(c);}
  getUtility(team){
    let wr=0,wl=0;
    for(const row of this.boardState)for(const p of row){
      if(!p)continue;
      if(p.team.r===this.teamR.r)wr+=p.getValue(this.boardState);
      else wl+=p.getValue(this.boardState);
    }
    let total=wr-wl;
    if(team.r===this.teamL.r)total=-total;
    return total;
  }
}

// ── Alpha-beta search ─────────────────────────────────────────────────────────
function alphaBetaSearch(root,team){
  let bestVal=-Infinity,beta=Infinity,best=null;
  for(const s of root.children){
    const v=abMin(s,bestVal,beta,team);
    if(v>bestVal){bestVal=v;best=s;}
  }
  return best;
}
function abMax(node,alpha,beta,team){
  if(!node.children.length)return node.getUtility(team);
  let v=-Infinity;
  for(const s of node.children){v=Math.max(v,abMin(s,alpha,beta,team));if(v>=beta)return v;alpha=Math.max(alpha,v);}
  return v;
}
function abMin(node,alpha,beta,team){
  if(!node.children.length)return node.getUtility(team);
  let v=Infinity;
  for(const s of node.children){v=Math.min(v,abMax(s,alpha,beta,team));if(v<=alpha)return v;beta=Math.min(beta,v);}
  return v;
}

// ── Tree builder (used inside Worker) ────────────────────────────────────────
function addNodes(node,teamR,teamL,team,depth){
  if(depth===0)return;
  const board=node.boardState;
  const pieces=[];for(const row of board)for(const p of row)if(p&&p.team.r===team.r)pieces.push(p);
  let king=null,check=false;
  for(const p of pieces)if(p instanceof King){king=p;check=p.calcTargets(board);}
  for(const p of pieces){
    p.calcTargets(board);
    if(check&&!(p instanceof King))p.skyFall(king);
    for(const target of p.targets){
      const nb=deepCopyGrid(board,teamR,teamL);
      const np=nb[p.row][p.col];
      nb[target.row][target.col]=np;
      if(np instanceof Pawn){
        const enemy=np.move(target.row,target.col,nb);
        if(enemy)nb[enemy.row][enemy.col]=null;
        // auto-promote
        if((np.startingRow+6)%12===target.row)nb[target.row][target.col]=new Queen(target.row,target.col,np.team);
      } else if(np instanceof King){
        const[rl,rt]=np.move(target.row,target.col,nb);
        if(rl&&rt){nb[rt.row][rt.col]=nb[rl.row][rl.col];nb[rl.row][rl.col]=null;const rp=nb[rt.row][rt.col];if(rp)rp.move(rt.row,rt.col,nb);}
      } else {np.move(target.row,target.col,nb);}
      nb[p.row][p.col]=null;
      const child=new TreeNode(nb,new Cell(p.row,p.col),new Cell(target.row,target.col),teamR,teamL);
      node.addChild(child);
    }
  }
  const next=team.r===teamL.r?teamR:teamL;
  for(const child of node.children)addNodes(child,teamR,teamL,next,depth-1);
}

// ── Worker entry point (runs only inside Worker context) ──────────────────────
if(typeof self!=='undefined'&&typeof document==='undefined'){
  self.onmessage=function(e){
    const d=e.data;
    const tR=new Team(d.teamR.r,d.teamR.g,d.teamR.b,d.teamR.name);
    const tL=new Team(d.teamL.r,d.teamL.g,d.teamL.b,d.teamL.name);
    const grid=deserializeGrid(d.grid,tR,tL);
    const currentTeam=d.currentTeamIsR?tR:tL;
    const root=new TreeNode(grid,null,null,tR,tL);
    addNodes(root,tR,tL,currentTeam,d.depth);
    const best=alphaBetaSearch(root,currentTeam);
    if(best)self.postMessage({fromRow:best.oldCell.row,fromCol:best.oldCell.col,toRow:best.newCell.row,toCol:best.newCell.col});
    else self.postMessage(null);
  };
}
</script>

<script>
'use strict';
// ── Constants ─────────────────────────────────────────────────────────────────
const LEDS=32,SCALE=20,CELL_PX=80; // 4 LEDs per cell × 20px = 80px; 8 cells × 80 = 640px
const RADIUS=(SCALE-2)/2;
const RELAY_URL='wss://relay.chess101.net';
const PROTOCOL_VERSION='1';
const PALETTE=[
  [64,180,232,'Blue'],[190,25,255,'Purple'],[254,220,0,'Yellow'],[250,125,125,'Pink'],
  [25,255,35,'Green'],[245,125,0,'Orange'],[0,25,230,'Dark Blue'],[28,225,180,'Cyan']
];

// ── Board themes ──────────────────────────────────────────────────────────────
const THEMES={
  default:{name:'Default',lightMult:[1.0,1.0,1.05],darkMult:[1.0,1.0,1.0],dark3d:0x0a0e16,light3d:0x141e2c,ambient:0x2a3050,ambientI:1.2},
  inferno:{name:'Inferno',lightMult:[1.0,0.32,0.08],darkMult:[0.6,0.10,0.02],dark3d:0x1a0400,light3d:0x3c1000,ambient:0x3a1008,ambientI:1.0},
  void:{name:'Void',lightMult:[0.0,0.70,1.0],darkMult:[0.0,0.20,0.40],dark3d:0x020008,light3d:0x06001a,ambient:0x080020,ambientI:1.0},
  jade:{name:'Jade',lightMult:[0.08,0.80,0.30],darkMult:[0.02,0.25,0.08],dark3d:0x021006,light3d:0x08261a,ambient:0x082015,ambientI:1.0},
  frost:{name:'Frost',lightMult:[0.60,0.82,1.0],darkMult:[0.20,0.30,0.45],dark3d:0x060e1e,light3d:0x0e1e36,ambient:0x101828,ambientI:1.1}
};
const THEME_ORDER=['default','inferno','void','jade','frost'];
let currentTheme='default';
let currentThemeObj=THEMES.default;

// ── Engine source for Worker ──────────────────────────────────────────────────
const ENGINE_SRC=document.getElementById('chess-engine').textContent;

// ── Canvas setup ──────────────────────────────────────────────────────────────
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');

// ── LED pixel buffer ──────────────────────────────────────────────────────────
const buf=new Uint8Array(LEDS*LEDS*3);
function setPixel(lx,ly,r,g,b){const i=(ly*LEDS+lx)*3;buf[i]=r;buf[i+1]=g;buf[i+2]=b;}
function getPixel(lx,ly){const i=(ly*LEDS+lx)*3;return[buf[i],buf[i+1],buf[i+2]];}
function clearBuf(){buf.fill(0);}
function lightCell(row,col,r,g,b){for(let i=0;i<4;i++)for(let j=0;j<4;j++)setPixel(col*4+j,row*4+i,r,g,b);}

function drawLED(lx,ly,r,g,b){
  const cx=lx*SCALE+SCALE/2,cy=ly*SCALE+SCALE/2;
  const bright=r>12||g>12||b>12;
  if(bright){
    const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,RADIUS*2.8);
    grd.addColorStop(0,`rgba(${r},${g},${b},.38)`);grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(cx,cy,RADIUS*2.8,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.beginPath();ctx.arc(cx,cy,RADIUS,0,Math.PI*2);ctx.fill();
  if(bright){
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();
    ctx.arc(cx-RADIUS*.22,cy-RADIUS*.22,RADIUS*.32,0,Math.PI*2);ctx.fill();
  }
}

function flip(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let ly=0;ly<LEDS;ly++)for(let lx=0;lx<LEDS;lx++){
    const[r,g,b]=getPixel(lx,ly);
    if(r||g||b)drawLED(lx,ly,r,g,b);
  }
}

// ── Piece glyphs (fallback for log text only) ─────────────────────────────────
const GLYPHS={Pawn:'♟',Rook:'♜',Knight:'♞',Bishop:'♝',Queen:'♛',King:'♚'};
function pieceGlyph(p){return GLYPHS[p.constructor.name]||'?';}

// ── Piece images (cburnett SVG set) ───────────────────────────────────────────
const PIECE_IMGS={};
if(typeof Image!=='undefined'){
  const PIECE_BASE='pieces/cburnett/';
  const nameMap={Pawn:'P',Rook:'R',Knight:'N',Bishop:'B',Queen:'Q',King:'K'};
  for(const[cls,abbr]of Object.entries(nameMap)){
    for(const col of['w','b']){
      const img=new Image();
      img.src=PIECE_BASE+col+abbr+'.svg';
      PIECE_IMGS[col+cls]=img;
    }
  }
}
function pieceImg(p){
  const col=(teamR&&p.team.r===teamR.r)?'w':'b';
  return PIECE_IMGS[col+p.constructor.name]||null;
}

// ── Game state ────────────────────────────────────────────────────────────────
const Phase={LOBBY:0,COLOR_PICK:1,WAR_GAMES:2,PLAYING:3,GAME_OVER:4};
let phase=Phase.LOBBY;
let grid=null,teamR=null,teamL=null;
let computerR=null,computerL=null;
let currentTeam=null;
let selectedPiece=null;
let inCheck=false;
let isDraw=false;
let winnerTeam=null;
let moveCount=0;
let peaceTime=0;
let promotingPawn=null; // {row,col}
let aiThinking=false;
let aiWorker=null;
let aiDisplayGrid=null;
let aiCurrentCandidate=null; // {fr,fc,tr,tc} — candidate being shown during AI thinking

// Move animation state (visual only — grid updates immediately)
const ANIM_MS=300;
let animPieces=[]; // [{piece,glyph,isWhite,cx,cy,toR,toC,startMs}] — active sliding pieces
let animOnDone=null; // called when all animPieces finish

// Move trails (glowing fade after piece moves)
let moveTrails=[]; // [{cells:[{r,c}], team:{r,g,b}, startMs, dur}]
const TRAIL_DUR=600;

// Spectator reactions (floating emoji)
let reactions=[]; // [{emoji, x, y, vy, alpha, startMs, ttl}]

// AI kibitzer
let kibOn=true;
let _pendingKibitz=null; // {piece, capture, fr, fc, tr, tc, team} — set by logMove, consumed by _doKibitz

// 3D view state
let threeD=true;
let threeInited=false;
let three=null; // {scene,camera,renderer,controls,boardSquares,pool,animMesh,lights}
let scanModeActive=false;
let savedCamPos=null,savedCamTarget=null;

// Color pick state
let selectedRIdx=null,selectedLIdx=null;

// Threefold repetition state
let daysR=[],doubleR=[],daysL=[],doubleL=[];

// Animation state
let checkerBrightness=0,checkerDir=2;
let thinkTick=0,lastThinkMs=0;
let gameOverColors=null,lastGameOverMs=0;
let blink=false; // 500ms blink for selected piece

// Lobby
let lobbySelected=0;
const LOBBY_OPTS=['Play Locally','Host Online','Join Online'];
const LOBBY_COLORS=[[25,255,35],[64,180,232],[245,125,0]];

// Network state
let ws=null,wsRole=null,roomCode=null;
let netPhase='idle'; // idle|connecting|waiting_peer|waiting_game_start
let peerName=null;
let localColorSent=false,remoteColorReceived=false;
let localWarSent=false,remoteWarReceived=false;
let isPhysicalHostMode=false; // Pi is HOST; browser (guest) picks both teams' colors and war choices
// For local mode these are always true
function colorReady(){return wsRole==='local'||(localColorSent&&remoteColorReceived);}
function warReady(){return wsRole==='local'||(localWarSent&&remoteWarReceived);}

// Sidebar log
const logLines=[];

// ── Turn helpers ─────────────────────────────────────────────────────────────
function isMyTurn(){
  if(!currentTeam)return false;
  if(wsRole==='local')return true;
  if(wsRole==='host')return currentTeam.r===teamR.r;
  if(wsRole==='guest')return currentTeam.r===teamL.r;
  return true;
}
function isWaitingForRemote(){return wsRole!=='local'&&!isMyTurn()&&!aiThinking;}

// ── Move log ──────────────────────────────────────────────────────────────────
const moveLog=[];
function logMove(team,piece,fromR,fromC,toR,toC,capture){
  const cols='abcdefgh',rows='87654321';
  const from=cols[fromC]+rows[fromR],to=cols[toC]+rows[toR];
  const cap=capture?' x':'';
  moveLog.push({text:`${team.name}: ${pieceGlyph(piece)} ${from}${cap}→${to}`,teamR:team.r===teamR.r});
  if(moveLog.length>80)moveLog.shift();
  addLog(`${team.name}: ${pieceGlyph(piece)} ${from}${cap}→${to}`);
  // Store info for kibitzer (inCheck resolved later in beginTurn)
  _pendingKibitz={piece,capture:capture||null,fr:fromR,fc:fromC,tr:toR,tc:toC,team};
}
function addLog(msg){logLines.push({msg,ts:Date.now()});if(logLines.length>60)logLines.shift();}

// ── Board initialization ──────────────────────────────────────────────────────
function initBoard(){
  grid=Array.from({length:8},()=>Array(8).fill(null));
  for(let c=0;c<8;c++)grid[1][c]=new Pawn(1,c,teamR);
  grid[0][0]=new Rook(0,0,teamR);grid[0][7]=new Rook(0,7,teamR);
  grid[0][1]=new Knight(0,1,teamR);grid[0][6]=new Knight(0,6,teamR);
  grid[0][2]=new Bishop(0,2,teamR);grid[0][5]=new Bishop(0,5,teamR);
  grid[0][3]=new Queen(0,3,teamR);grid[0][4]=new King(0,4,teamR);
  for(let c=0;c<8;c++)grid[6][c]=new Pawn(6,c,teamL);
  grid[7][0]=new Rook(7,0,teamL);grid[7][7]=new Rook(7,7,teamL);
  grid[7][1]=new Knight(7,1,teamL);grid[7][6]=new Knight(7,6,teamL);
  grid[7][2]=new Bishop(7,2,teamL);grid[7][5]=new Bishop(7,5,teamL);
  grid[7][3]=new Queen(7,3,teamL);grid[7][4]=new King(7,4,teamL);
}

function resetGame(){
  grid=null;teamR=null;teamL=null;computerR=null;computerL=null;
  currentTeam=null;selectedPiece=null;inCheck=false;isDraw=false;winnerTeam=null;
  moveCount=0;peaceTime=0;promotingPawn=null;aiThinking=false;
  if(aiWorker){aiWorker.terminate();aiWorker=null;}
  aiDisplayGrid=null;aiCurrentCandidate=null;selectedRIdx=null;selectedLIdx=null;
  daysR=[];doubleR=[];daysL=[];doubleL=[];
  checkerBrightness=0;checkerDir=2;
  gameOverColors=null;blink=false;
  moveLog.length=0;logLines.length=0;
  localColorSent=false;remoteColorReceived=false;localWarSent=false;remoteWarReceived=false;
  isPhysicalHostMode=false;
  netPhase='idle';
  moveTrails=[];reactions=[];_pendingKibitz=null;
}

// ── Draw rules ────────────────────────────────────────────────────────────────
function gridTypeKey(g){return g.map(row=>row.map(p=>p?p.constructor.name[0]:'.')).join('');}

function bobRoss(team){
  if(peaceTime>=50){triggerDraw();return true;}
  const days=team.r===teamL.r?daysL:daysR;
  const dbl=team.r===teamL.r?doubleL:doubleR;
  const key=gridTypeKey(grid);
  if(peaceTime===0){days.length=0;dbl.length=0;days.push(key);return false;}
  if(dbl.some(k=>k===key)){triggerDraw();return true;}
  if(days.some(k=>k===key)){dbl.push(key);return false;}
  days.push(key);return false;
}

function triggerDraw(){isDraw=true;phase=Phase.GAME_OVER;addLog('Draw!');}
function declareVictory(losingTeam){winnerTeam=losingTeam.r===teamL.r?teamR:teamL;phase=Phase.GAME_OVER;addLog(`${winnerTeam.name} wins by checkmate!`);}

// ── Apply move ────────────────────────────────────────────────────────────────
function applyMove(oldR,oldC,toR,toC){
  const piece=grid[toR][toC];
  if(piece instanceof Pawn){
    peaceTime=0;
    const enemy=piece.move(toR,toC,grid);
    if(enemy)grid[enemy.row][enemy.col]=null;
    if((piece.startingRow+6)%12===toR){
      // auto-promote to Queen
      grid[toR][toC]=new Queen(toR,toC,piece.team);
      addLog(`${piece.team.name}: Promoted to Queen at ${toR},${toC}`);
      promotingPawn=null;
    }
  } else if(piece instanceof King){
    const[rl,rt]=piece.move(toR,toC,grid);
    if(rl&&rt){
      grid[rt.row][rt.col]=grid[rl.row][rl.col];
      grid[rl.row][rl.col]=null;
      const rp=grid[rt.row][rt.col];
      if(rp)rp.move(rt.row,rt.col,grid);
    }
  } else {
    if(piece)piece.move(toR,toC,grid);
  }
  grid[oldR][oldC]=null;
}

// ── Eval bar ──────────────────────────────────────────────────────────────────
const _EVAL_VALS={Pawn:1,Knight:3,Bishop:3,Rook:5,Queen:9,King:0};
function calcEval(){
  if(!grid||!teamR||!teamL)return 0;
  let sr=0,sl=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=grid[r][c];if(!p)continue;
    const v=_EVAL_VALS[p.constructor.name]||0;
    if(p.team.r===teamR.r)sr+=v;else sl+=v;
  }
  return sr-sl; // positive = teamR ahead
}

// ── Board themes ──────────────────────────────────────────────────────────────
function applyTheme(name){
  const t=THEMES[name];if(!t)return;
  currentTheme=name;currentThemeObj=t;
  if(!three)return;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const dark=(r+c)%2===1;
    const hex=dark?t.dark3d:t.light3d;
    three.boardSquares[r][c].material.color.setHex(hex);
    three.boardSquares[r][c].material.emissive.setHex(hex);
  }
  if(three.ambientLight){three.ambientLight.color.setHex(t.ambient);three.ambientLight.intensity=t.ambientI;}
}

// ── Move trails ───────────────────────────────────────────────────────────────
function addMoveTrail(fr,fc,tr,tc,team){
  if(!team)return;
  const cells=[{r:fr,c:fc}];
  const dr=Math.sign(tr-fr),dc=Math.sign(tc-fc);
  // Include intermediate squares for sliding rays (rook/bishop/queen)
  if((dr!==0||dc!==0)&&(dr===0||dc===0||Math.abs(tr-fr)===Math.abs(tc-fc))){
    let r=fr+dr,c=fc+dc;
    while((r!==tr||c!==tc)&&r>=0&&r<8&&c>=0&&c<8){cells.push({r,c});r+=dr;c+=dc;}
  }
  moveTrails.push({cells,team:{r:team.r,g:team.g,b:team.b},startMs:performance.now(),dur:TRAIL_DUR});
}

function renderTrails(now){
  for(let i=moveTrails.length-1;i>=0;i--){
    const t=moveTrails[i];
    const age=now-t.startMs;
    if(age>=t.dur){moveTrails.splice(i,1);continue;}
    const frac=1-age/t.dur;
    const bright=Math.round(frac*160);
    for(const{r,c}of t.cells){
      const[er,eg,eb]=getPixel(c*4,r*4);
      lightCell(r,c,
        Math.min(255,er+Math.round(t.team.r*bright/255)),
        Math.min(255,eg+Math.round(t.team.g*bright/255)),
        Math.min(255,eb+Math.round(t.team.b*bright/255))
      );
    }
  }
}

// ── Spectator reactions ───────────────────────────────────────────────────────
function spawnReaction(emoji){
  reactions.push({emoji,x:60+Math.random()*520,y:590+Math.random()*50,vy:-(0.8+Math.random()*0.8),startMs:performance.now(),ttl:2500});
}

function renderReactions(now){
  const rc=document.getElementById('react-overlay');if(!rc)return;
  const rctx=rc.getContext('2d');
  rctx.clearRect(0,0,rc.width,rc.height);
  for(let i=reactions.length-1;i>=0;i--){
    const rx=reactions[i];
    const age=now-rx.startMs;
    if(age>=rx.ttl){reactions.splice(i,1);continue;}
    rx.y+=rx.vy;
    const frac=age/rx.ttl;
    const alpha=1-frac;
    const size=Math.round(32*(1+frac*0.4));
    rctx.save();rctx.globalAlpha=alpha;
    rctx.font=`${size}px serif`;rctx.textAlign='center';
    rctx.fillText(rx.emoji,rx.x,rx.y);
    rctx.restore();
  }
}

// ── AI kibitzer ───────────────────────────────────────────────────────────────
function _doKibitz(isCheck){
  if(!kibOn||!_pendingKibitz)return;
  const{piece,capture,fr,fc,tr,tc,team}=_pendingKibitz;
  _pendingKibitz=null;
  const isCastle=piece instanceof King&&Math.abs(tc-fc)===2;
  const isPromo=piece instanceof Pawn&&(tr===0||tr===7);
  let msg=null;
  if(isPromo){
    msg='Pawn promoted to Queen — powerful!';
  }else if(isCastle){
    msg='Castled — king tucked away safely.';
  }else if(capture){
    const val=_EVAL_VALS[capture.constructor.name]||0;
    const ev=calcEval();
    const lead=team.r===teamR.r?ev:-ev;
    if(val>=9)msg=`Queen taken! ${team.name} made a massive gain.`;
    else if(val>=5)msg=`Rook captured — ${team.name} up in material.`;
    else if(val>=3)msg=`Minor piece captured (+${val}).`;
    else msg=lead>4?`Pawn taken. ${team.name} dominates.`:'Pawn taken.';
  }else if(isCheck){
    msg=`Check! ${team.name} is attacking the king.`;
  }else if(piece){
    const pname=piece.constructor.name;
    if(pname==='Pawn'){
      const flavor=['Solid pawn push.','Center control.','Structural move.'];
      msg=flavor[moveCount%flavor.length];
    }else if(pname!=='King'){
      const flavor=['Active piece placement.','Improving piece activity.','Developing the position.'];
      msg=flavor[moveCount%flavor.length];
    }
  }
  if(msg)addLog('💡 '+msg);
}

// ── Begin turn ────────────────────────────────────────────────────────────────
function beginTurn(team){
  if(bobRoss(team))return;
  // Clear current team's en_passantable
  for(const row of grid)for(const p of row)if(p instanceof Pawn&&p.team.r===team.r)p.enPassantable=false;
  // King first
  let king=null,kingRow=-1,kingCol=-1;
  let check=false;
  for(const row of grid)for(const p of row){
    if(p instanceof King&&p.team.r===team.r){
      king=p;check=p.calcTargets(grid);kingRow=p.row;kingCol=p.col;
    }
  }
  // All non-king pieces for current team only
  let piecesWithMoves=king&&king.getTargets().length>0?1:0;
  for(const row of grid)for(const p of row){
    if(!p||p instanceof King||p.team.r!==team.r)continue;
    p.calcTargets(grid);
    if(check&&king)p.skyFall(king);
    if(p.getTargets().length>0)piecesWithMoves++;
  }
  if(piecesWithMoves===0){
    if(!check){triggerDraw();}
    else{declareVictory(team);}
    return;
  }
  inCheck=check;
  _doKibitz(check);
  if(inCheck)addLog(`${team.name} is in check!`);
  const isAI=(team.r===teamR.r&&computerR)||(team.r===teamL.r&&computerL);
  if(isAI&&isMyTurn()){aiThinking=true;launchAI();}
}

function nextTurn(){
  selectedPiece=null;inCheck=false;aiThinking=false;
  const next=currentTeam.r===teamR.r?teamL:teamR;
  currentTeam=next;
  // Send move to peer if online
  beginTurn(currentTeam);
}

// ── Move animation ────────────────────────────────────────────────────────────
function buildAnimEntries(piece,fr,fc,tr,tc){
  if(!piece)return[];
  const isWhite=teamR&&piece.team.r===teamR.r;
  const entries=[{piece,glyph:pieceGlyph(piece),isWhite,fromR:fr,fromC:fc,toR:tr,toC:tc}];
  // Detect castling: King moves 2 columns
  if(piece instanceof King&&Math.abs(tc-fc)===2){
    const rookFromC=tc>fc?7:0;
    const rookToC=tc>fc?5:3;
    const rook=grid[tr][rookFromC];
    if(rook)entries.push({piece:rook,glyph:pieceGlyph(rook),isWhite,fromR:tr,fromC:rookFromC,toR:tr,toC:rookToC});
  }
  return entries;
}

function startAnims(entries,onDone){
  // entries: [{piece,glyph,isWhite,fromR,fromC,toR,toC}]
  const now=performance.now();
  animPieces=entries.map(e=>Object.assign({},e,{startMs:now}));
  animOnDone=onDone;
  // Add move trail for the primary piece
  if(entries.length>0&&currentTeam){
    const e=entries[0];
    addMoveTrail(e.fromR,e.fromC,e.toR,e.toC,currentTeam);
  }
}

function updateAnims(now){
  if(!animPieces.length)return false;
  let allDone=true;
  for(const a of animPieces){
    const prog=Math.min(1,(now-a.startMs)/ANIM_MS);
    const t=1-(1-prog)**2; // ease-out quad
    const fromCx=a.fromC*CELL_PX+CELL_PX/2, fromCy=a.fromR*CELL_PX+CELL_PX/2;
    const toCx=a.toC*CELL_PX+CELL_PX/2,   toCy=a.toR*CELL_PX+CELL_PX/2;
    a.cx=fromCx+(toCx-fromCx)*t;
    a.cy=fromCy+(toCy-fromCy)*t;
    if(prog<1)allDone=false;
  }
  if(allDone){
    animPieces=[];
    const cb=animOnDone;animOnDone=null;
    if(cb)cb();
    return false;
  }
  return true;
}

function drawAnimPieces(){
  if(!animPieces.length)return;
  for(const a of animPieces){
    if(a.cx!==undefined)drawOnePiece(a.piece,a.cx,a.cy);
  }
}

// ── AI ────────────────────────────────────────────────────────────────────────
let _aiPendingMove=undefined; // undefined=not yet, null=no move, else move obj
let _aiCandidatesShown=0;
const AI_MIN_SHOW=8;    // show at least this many candidates before applying
const AI_CAND_MS=140;   // ms per candidate display

function _applyAIMove(move){
  if(!aiThinking)return;
  aiThinking=false;aiDisplayGrid=null;aiCurrentCandidate=null;
  if(aiWorker){aiWorker.terminate();aiWorker=null;}
  if(move){
    const{fromRow:fr,fromCol:fc,toRow:tr,toCol:tc}=move;
    const capture=grid[tr][tc];
    if(capture)peaceTime=0;else peaceTime++;
    const piece=grid[fr][fc];
    if(piece){logMove(currentTeam,piece,fr,fc,tr,tc,!!capture);}
    const entries=buildAnimEntries(piece,fr,fc,tr,tc);
    grid[tr][tc]=grid[fr][fc];
    applyMove(fr,fc,tr,tc);
    moveCount++;
    sendMoveToRelay(fr,fc,tr,tc);
    startAnims(entries,nextTurn);
  } else {
    nextTurn();
  }
}

function launchAI(){
  if(aiWorker){aiWorker.terminate();aiWorker=null;}
  _aiPendingMove=undefined;
  _aiCandidatesShown=0;

  // Collect all legal moves for the AI team to show as "considering..." display
  const candidates=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=grid[r][c];
    if(!p||p.team.r!==currentTeam.r)continue;
    p.calcTargets(grid);
    for(const t of p.targets)candidates.push({fr:p.row,fc:p.col,tr:t.row,tc:t.col});
  }
  // Shuffle so displayed candidates vary each turn
  for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]];}

  function showCandidate(ci){
    if(!aiThinking)return;
    if(candidates.length){
      aiCurrentCandidate=candidates[ci%candidates.length];
    }
    _aiCandidatesShown++;
    if(_aiCandidatesShown>=AI_MIN_SHOW&&_aiPendingMove!==undefined){
      _applyAIMove(_aiPendingMove);
    } else {
      setTimeout(()=>showCandidate(ci+1),AI_CAND_MS);
    }
  }
  if(candidates.length>0)showCandidate(0);

  // Launch Worker in parallel — result stored, applied after enough candidates shown
  const blob=new Blob([ENGINE_SRC],{type:'text/javascript'});
  aiWorker=new Worker(URL.createObjectURL(blob));
  aiWorker.onmessage=function(e){
    if(!aiThinking)return;
    _aiPendingMove=e.data;
    if(_aiCandidatesShown>=AI_MIN_SHOW)_applyAIMove(_aiPendingMove);
  };
  aiWorker.postMessage({
    grid:serializeGrid(grid),
    teamR:{r:teamR.r,g:teamR.g,b:teamR.b,name:teamR.name},
    teamL:{r:teamL.r,g:teamL.g,b:teamL.b,name:teamL.name},
    currentTeamIsR:currentTeam.r===teamR.r,
    depth:2
  });
}

// ── Network relay ─────────────────────────────────────────────────────────────
function connectRelay(role,code){
  wsRole=role;roomCode=code||null;
  ws=new WebSocket(RELAY_URL);
  ws.onopen=function(){
    if(role==='host'){
      ws.send(JSON.stringify({type:'relay_create',player_name:'Browser'}));
    } else {
      ws.send(JSON.stringify({type:'relay_join',room_code:code.toUpperCase(),player_name:'Browser'}));
    }
    netPhase='connecting';
  };
  ws.onmessage=function(e){
    let msg;try{msg=JSON.parse(e.data);}catch{return;}
    handleRelayMsg(msg);
  };
  ws.onclose=function(){addLog('Disconnected from relay.');};
  ws.onerror=function(){addLog('Relay connection error.');};
}

function netSend(obj){if(ws&&ws.readyState===1)ws.send(JSON.stringify(obj));}
function sendMoveToRelay(fr,fc,tr,tc){
  if(!ws||wsRole==='local')return;
  netSend({type:'move',from_row:fr,from_col:fc,to_row:tr,to_col:tc});
}

function handleRelayMsg(msg){
  const t=msg.type;
  if(t==='relay_created'){
    roomCode=msg.room_code;
    if(wsRole==='host'){netPhase='waiting_peer';addLog(`Room: ${roomCode}`);}
    else{
      // GUEST: send hello after joining
      netSend({type:'hello',version:PROTOCOL_VERSION,player_name:'Browser',role:'guest'});
      netPhase='waiting_game_start';
    }
  } else if(t==='relay_peer_connected'){
    peerName=msg.peer_name||'Opponent';
    if(wsRole==='host'){
      netSend({type:'hello',version:PROTOCOL_VERSION,player_name:'Browser',role:'host'});
    }
  } else if(t==='relay_error'){
    addLog(`Relay error: ${msg.code}`);phase=Phase.LOBBY;
  } else if(t==='hello'){
    peerName=msg.player_name||'Opponent';
    if(wsRole==='host'){
      // Send game_setup
      netSend({type:'game_setup',version:PROTOCOL_VERSION,host_name:'Browser',guest_name:peerName});
      phase=Phase.COLOR_PICK;
    }
  } else if(t==='game_setup'){
    if(wsRole==='guest'){
      peerName=msg.host_name||'Host';
      phase=Phase.COLOR_PICK;
      if(msg.mode==='physical_host')isPhysicalHostMode=true;
    }
  } else if(t==='color_chosen'){
    const key=msg.team_key;
    let r,g,b,name,idx;
    if(msg.color_idx!=null){
      idx=msg.color_idx;const pal=PALETTE[idx];r=pal[0];g=pal[1];b=pal[2];name=pal[3];
    } else {
      // iOS/RGB format — find closest palette entry for idx
      r=msg.r||0;g=msg.g||0;b=msg.b||0;name=msg.name||'';
      let bd=Infinity;PALETTE.forEach((p,i)=>{const d=(r-p[0])**2+(g-p[1])**2+(b-p[2])**2;if(d<bd){bd=d;idx=i;}});
    }
    if(key==='r'){teamR.r=r;teamR.g=g;teamR.b=b;teamR.name=name;selectedRIdx=idx;}
    else{teamL.r=r;teamL.g=g;teamL.b=b;teamL.name=name;selectedLIdx=idx;}
    remoteColorReceived=true;checkColorComplete();
  } else if(t==='war_games_choice'){
    const key=msg.team_key;
    const isAi=msg.is_ai!=null?!!msg.is_ai:(msg.player_type==='ai');
    if(key==='r')computerR=isAi;else computerL=isAi;
    remoteWarReceived=true;checkWarComplete();
  } else if(t==='game_start'){
    if(wsRole==='guest')startGame(); // HOST already started via checkWarComplete
  } else if(t==='move'){
    handleRemoteMove(msg);
  } else if(t==='game_event'){
    const ev=msg.event;
    if(ev==='checkmate'||ev==='stalemate')phase=Phase.GAME_OVER;
  } else if(t==='new_game'){
    resetGame();phase=Phase.LOBBY;
  } else if(t==='reaction'){
    spawnReaction(msg.emoji||'🔥');
  } else if(t==='ping'){
    netSend({type:'pong',seq:msg.seq||0});
  } else if(t==='pong'){
    // keepalive acknowledged — nothing to do
  }
}

function checkColorComplete(){
  if(selectedRIdx===null||selectedLIdx===null)return;
  if(!colorReady())return;
  teamR.r+=1; // BUG-02 preserved
  phase=Phase.WAR_GAMES;
}
function checkWarComplete(){
  if(computerR===null||computerL===null)return;
  if(!warReady())return;
  if(wsRole==='host'){netSend({type:'game_start'});}
  // In physical_host mode Pi sends game_start; browser waits for it
  if(wsRole!=='guest'&&!isPhysicalHostMode)startGame();
}

function handleRemoteMove(msg){
  const fr=msg.from_row,fc=msg.from_col,tr=msg.to_row,tc=msg.to_col;
  if(!grid)return;
  const capture=grid[tr][tc];
  if(capture)peaceTime=0;else peaceTime++;
  const piece=grid[fr][fc];
  if(piece)logMove(currentTeam,piece,fr,fc,tr,tc,!!capture);
  const entries=buildAnimEntries(piece,fr,fc,tr,tc);
  grid[tr][tc]=grid[fr][fc];
  applyMove(fr,fc,tr,tc);
  moveCount++;
  startAnims(entries,nextTurn);
}

// ── Start game ────────────────────────────────────────────────────────────────
function startGame(){
  initBoard();
  currentTeam=teamR;
  phase=Phase.PLAYING;
  addLog(`Game start! ${teamR.name} vs ${teamL.name}`);
  beginTurn(currentTeam);
}

function initTeams(){

  teamL=new Team(190,25,255,'Purple');
}

// ── Rendering ─────────────────────────────────────────────────────────────────
function renderLobby(now){
  clearBuf();
  // When hosting online and waiting for peer, show ChessMatrix barcode
  if(netPhase==='waiting_peer'&&roomCode){
    const cmGrid=encodeChessMatrix(roomCode);
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const[cr,cg,cb]=cmGrid[r][c];
        lightCell(r,c,cr,cg,cb);
      }
    }
    if(threeD){renderThree(now);return;}
    flip();
    return;
  }
  for(let opt=0;opt<3;opt++){
    const sel=lobbySelected===opt;
    const[r,g,b]=LOBBY_COLORS[opt];
    const scale=sel?1:0.35; // unselected options stay visible at 35%
    // rows 0-1 = opt0, 2-3 = opt1, 4-5 = opt2
    for(let col=0;col<8;col++){
      lightCell(opt*2,col,Math.floor(r*scale),Math.floor(g*scale),Math.floor(b*scale));
      lightCell(opt*2+1,col,Math.floor(r*scale*0.4),Math.floor(g*scale*0.4),Math.floor(b*scale*0.4));
    }
  }
  if(threeD){renderThree(now);return;}
  flip();
}

function renderColorPick(now){
  clearBuf();
  const t=now/1000;
  for(let col=0;col<8;col++){
    const[pr,pg,pb]=PALETTE[col];
    // Row 2 = team R, row 5 = team L
    // Dim unselected cells once a pick is made on that row
    const dimR=(selectedRIdx!==null&&col!==selectedRIdx)?0.25:1;
    const dimL=(selectedLIdx!==null&&col!==selectedLIdx)?0.25:1;
    lightCell(2,col,Math.floor(pr*dimR),Math.floor(pg*dimR),Math.floor(pb*dimR));
    lightCell(5,col,Math.floor(pr*dimL),Math.floor(pg*dimL),Math.floor(pb*dimL));
  }
  if(threeD){renderThree(now);return;}
  flip();
}

function renderWarGames(now){
  clearBuf();
  // Row 3 = team R: cols 0-3 human (solid teamR), cols 4-7 AI (white+dot)
  // Row 4 = team L: cols 0-3 AI (white+dot), cols 4-7 human (solid teamL)
  if(computerR===null){
    // Not yet chosen: left half = Human option (team color), right half = AI option (dim + dot)
    for(let c=0;c<4;c++){if(teamR)lightCell(3,c,teamR.r,teamR.g,teamR.b);}
    for(let c=4;c<8;c++)lightCell(3,c,30,30,30);
    const dotR=(Math.floor(now/200)%4)+4;
    lightCell(3,dotR,200,200,200);
  } else if(computerR){
    // AI chosen: whole row animates as AI
    for(let c=0;c<8;c++)lightCell(3,c,30,30,30);
    const dotR=Math.floor(now/200)%8;
    lightCell(3,dotR,200,200,200);
  } else {
    // Human chosen: whole row lights up team color
    for(let c=0;c<8;c++){if(teamR)lightCell(3,c,teamR.r,teamR.g,teamR.b);}
  }
  if(computerL===null){
    // Not yet chosen: left half = AI option (dim + dot), right half = Human option (team color)
    for(let c=0;c<4;c++)lightCell(4,c,30,30,30);
    const dotL=3-(Math.floor(now/200)%4);
    lightCell(4,dotL,200,200,200);
    for(let c=4;c<8;c++){if(teamL)lightCell(4,c,teamL.r,teamL.g,teamL.b);}
  } else if(computerL){
    // AI chosen: whole row animates as AI
    for(let c=0;c<8;c++)lightCell(4,c,30,30,30);
    const dotL=7-(Math.floor(now/200)%8);
    lightCell(4,dotL,200,200,200);
  } else {
    // Human chosen: whole row lights up team color
    for(let c=0;c<8;c++){if(teamL)lightCell(4,c,teamL.r,teamL.g,teamL.b);}
  }
  if(threeD){renderThree(now);return;}
  flip();
}

function renderPlaying(now){
  clearBuf();
  // Checker background — static dim; FROM/TO highlights carry the AI thinking visual
  checkerBrightness=60;
  const cb=checkerBrightness;
  const tl=currentThemeObj.lightMult,td=currentThemeObj.darkMult;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const light=(r+c)%2===0;
    if(light){
      const v=Math.min(255,Math.floor(cb*3.2));
      lightCell(r,c,Math.min(255,Math.round(v*tl[0])),Math.min(255,Math.round(v*tl[1])),Math.min(255,Math.round(v*tl[2])));
    } else {
      const v=Math.floor(cb*0.10);
      lightCell(r,c,Math.round(v*td[0]),Math.round(v*td[1]),Math.round(v*td[2]));
    }
  }

  // Highlight AI candidate move: FROM square (full team color) + TO square (45% dim)
  if(aiThinking&&aiCurrentCandidate&&currentTeam){
    const{fr,fc,tr,tc}=aiCurrentCandidate;
    const t=currentTeam;
    lightCell(fr,fc,t.r,t.g,t.b);
    lightCell(tr,tc,Math.floor(t.r*0.45),Math.floor(t.g*0.45),Math.floor(t.b*0.45));
  }

  const displayGrid=grid; // real board always; candidate shown via lightCell above

  // Highlight targets
  if(selectedPiece&&!aiThinking){
    for(const t of selectedPiece.targets){
      lightCell(t.row,t.col,selectedPiece.team.r,selectedPiece.team.g,selectedPiece.team.b);
    }
  }

  // Selected piece blink
  if(selectedPiece&&!aiThinking){
    const blinkOn=Math.floor(now/500)%2===0;
    if(blinkOn){lightCell(selectedPiece.row,selectedPiece.col,255,255,255);}
    else if(grid&&grid[selectedPiece.row]&&grid[selectedPiece.row][selectedPiece.col]){
      const p=grid[selectedPiece.row][selectedPiece.col];
      if(p)lightCell(selectedPiece.row,selectedPiece.col,p.team.r,p.team.g,p.team.b);
    }
  }

  // Check flash
  if(inCheck&&grid){
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){
      const p=grid[r][c];
      if(p instanceof King&&p.team.r===currentTeam.r){
        const checkOn=Math.floor(now/250)%2===0;
        if(checkOn)lightCell(r,c,255,50,50);
      }
    }
  }

  renderTrails(now);
  updateAnims(now);
  if(threeD){renderThree(now);return;}
  flip();
  drawPieceOverlay(displayGrid);
}

function renderGameOver(now){
  clearBuf();
  if(isDraw){
    for(let r=0;r<4;r++)for(let c=0;c<8;c++){if(teamR)lightCell(r,c,teamR.r,teamR.g,teamR.b);}
    for(let r=4;r<8;r++)for(let c=0;c<8;c++){if(teamL)lightCell(r,c,teamL.r,teamL.g,teamL.b);}
  } else if(winnerTeam){
    const w=winnerTeam;
    if(!gameOverColors||now-lastGameOverMs>=50){
      gameOverColors=Array.from({length:6},()=>Array.from({length:6},()=>[Math.random()*255|0,Math.random()*255|0,Math.random()*255|0]));
      lastGameOverMs=now;
    }
    // Border in winner color
    for(let m=0;m<8;m++){lightCell(m,0,w.r,w.g,w.b);lightCell(m,7,w.r,w.g,w.b);}
    for(let m=0;m<8;m++){lightCell(0,m,w.r,w.g,w.b);lightCell(7,m,w.r,w.g,w.b);}
    // Inner 6x6 random
    for(let r=0;r<6;r++)for(let c=0;c<6;c++){const[ir,ig,ib]=gameOverColors[r][c];lightCell(r+1,c+1,ir,ig,ib);}
  }
  if(threeD){renderThree(now);return;}
  flip();
}

function drawOnePiece(p,cx,cy){
  const img=pieceImg(p);
  const sz=Math.floor(CELL_PX*0.82);
  const half=sz/2;
  // Subtle team-color glow ring behind the piece
  const pr=Math.floor(CELL_PX*0.42);
  ctx.save();
  ctx.globalAlpha=0.35;
  ctx.fillStyle=`rgb(${p.team.r},${p.team.g},${p.team.b})`;
  ctx.beginPath();ctx.arc(cx,cy,pr,0,Math.PI*2);ctx.fill();
  ctx.restore();
  if(img&&img.complete&&img.naturalWidth>0){
    ctx.drawImage(img,cx-half,cy-half,sz,sz);
  } else {
    // Fallback glyph while image loads
    ctx.save();
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`bold ${Math.floor(CELL_PX*0.52)}px serif`;
    const isWhite=teamR&&p.team.r===teamR.r;
    ctx.fillStyle=isWhite?'rgba(255,255,255,0.95)':'rgba(10,10,10,0.95)';
    ctx.fillText(pieceGlyph(p),cx,cy);
    ctx.restore();
  }
}

function drawPieceOverlay(g){
  if(!g)return;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=g[r][c];if(!p)continue;
    // Skip pieces being animated at their destination (drawn by drawAnimPieces)
    if(animPieces.some(a=>a.toR===r&&a.toC===c&&a.piece===p))continue;
    const cx=c*CELL_PX+CELL_PX/2,cy=r*CELL_PX+CELL_PX/2;
    drawOnePiece(p,cx,cy);
  }
  drawAnimPieces();
}

function render(now){
  if(phase===Phase.LOBBY)renderLobby(now);
  else if(phase===Phase.COLOR_PICK)renderColorPick(now);
  else if(phase===Phase.WAR_GAMES)renderWarGames(now);
  else if(phase===Phase.PLAYING)renderPlaying(now);
  else if(phase===Phase.GAME_OVER)renderGameOver(now);
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function pxToCell(px,py){
  const col=Math.floor(px/CELL_PX),row=Math.floor(py/CELL_PX);
  if(col<0||col>7||row<0||row>7)return null;
  return[row,col];
}

canvas.addEventListener('click',function(e){
  const rect=canvas.getBoundingClientRect();
  const px=(e.clientX-rect.left)*(canvas.width/rect.width);
  const py=(e.clientY-rect.top)*(canvas.height/rect.height);
  handleClick(px,py);
});
canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  const touch=e.touches[0];
  const rect=canvas.getBoundingClientRect();
  const px=(touch.clientX-rect.left)*(canvas.width/rect.width);
  const py=(touch.clientY-rect.top)*(canvas.height/rect.height);
  handleClick(px,py);
},{passive:false});

function handleClick(px,py){
  if(replayMode)return; // block clicks during corpus replay
  const cell=pxToCell(px,py);
  if(phase===Phase.LOBBY){handleLobbyClick(cell);return;}
  if(phase===Phase.COLOR_PICK){handleColorPickClick(cell);return;}
  if(phase===Phase.WAR_GAMES){handleWarGamesClick(cell);return;}
  if(phase===Phase.PLAYING){handlePlayingClick(cell);return;}
  if(phase===Phase.GAME_OVER)return;
}

function handleLobbyClick(cell){
  if(!cell)return;
  if(netPhase==='waiting_peer')return; // ChessMatrix showing, ignore clicks
  const[row]=cell;
  const opt=Math.floor(row/2); // rows 0-1=opt0, 2-3=opt1, 4-5=opt2
  if(opt>=0&&opt<3)lobbySelect(opt);
}

function lobbySelect(opt){
  lobbySelected=opt;
  if(opt===0){
    wsRole='local';initTeams();phase=Phase.COLOR_PICK;
    addLog('Local game selected.');
  } else if(opt===1){
    initTeams();connectRelay('host');
    addLog('Connecting to relay…');
  } else if(opt===2){
    initTeams();showJoinOverlay();
  }
}

function handleColorPickClick(cell){
  if(!cell||!teamR||!teamL)return;
  const[row,col]=cell;
  // HOST controls row 2 (team_r), GUEST controls row 5 (team_l).
  // In physical_host mode Pi picks row 2 on the physical board; guest picks row 5 only.
  if(row===2){
    if(wsRole==='guest')return;
    selectedRIdx=col;
    const p=PALETTE[col];teamR.r=p[0];teamR.g=p[1];teamR.b=p[2];teamR.name=p[3];
    if(wsRole!=='local'){netSend({type:'color_chosen',team_key:'r',color_idx:col});localColorSent=true;}
  } else if(row===5){
    if(wsRole==='host')return;
    selectedLIdx=col;
    const p=PALETTE[col];teamL.r=p[0];teamL.g=p[1];teamL.b=p[2];teamL.name=p[3];
    if(wsRole!=='local'){netSend({type:'color_chosen',team_key:'l',color_idx:col});localColorSent=true;}
  }
  checkColorComplete();
}

function handleWarGamesClick(cell){
  if(!cell||!teamR||!teamL)return;
  const[row,col]=cell;
  // HOST controls row 3 (team_r), GUEST controls row 4 (team_l).
  // In physical_host mode Pi picks row 3 on the physical board; guest picks row 4 only.
  if(row===3){
    if(wsRole==='guest')return;
    computerR=col>=4; // cols 0-3=Human, cols 4-7=AI
    if(wsRole!=='local'){netSend({type:'war_games_choice',team_key:'r',is_ai:computerR});}
    localWarSent=true;
    checkWarComplete();
  } else if(row===4){
    if(wsRole==='host')return;
    computerL=col<4; // cols 0-3=AI, cols 4-7=Human (kitty-corner)
    if(wsRole!=='local'){netSend({type:'war_games_choice',team_key:'l',is_ai:computerL});localWarSent=true;}
    checkWarComplete();
  }
}

function handlePlayingClick(cell){
  if(aiThinking||animPieces.length)return;
  const isAI=(currentTeam.r===teamR.r&&computerR)||(currentTeam.r===teamL.r&&computerL);
  if(isAI||!isMyTurn())return;
  if(!cell){selectedPiece=null;return;}
  const[row,col]=cell;
  if(selectedPiece){
    // Try to move
    for(const t of selectedPiece.targets){
      if(t.row===row&&t.col===col){
        const oldR=selectedPiece.row,oldC=selectedPiece.col;
        const capture=grid[row][col];
        if(capture)peaceTime=0;else peaceTime++;
        logMove(currentTeam,selectedPiece,oldR,oldC,row,col,!!capture);
        addMoveTrail(oldR,oldC,row,col,currentTeam);
        grid[row][col]=grid[oldR][oldC];
        applyMove(oldR,oldC,row,col);
        moveCount++;
        selectedPiece=null;
        sendMoveToRelay(oldR,oldC,row,col);
        nextTurn();
        return;
      }
    }
    // Click same piece = deselect; click another friendly = select it
    const p=grid[row][col];
    if(p&&p===selectedPiece)selectedPiece=null;
    else if(p&&p.team.r===currentTeam.r)selectedPiece=p;
    else selectedPiece=null;
  } else {
    const p=grid[row][col];
    if(p&&p.team.r===currentTeam.r)selectedPiece=p;
  }
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  // Replay controls take priority
  if(replayMode&&replayCorpus&&phase===Phase.PLAYING){
    if(e.key===' '){replayPaused=!replayPaused;e.preventDefault();return;}
    if(e.key==='ArrowRight'){if(replayPly<replayCorpus.moves.length)replayStepForward();return;}
    if(e.key==='ArrowLeft'){if(replayPly>0)replayToTarget(replayPly-1);return;}
    if(e.key==='ArrowUp'){if(replaySpeedIdx>0)replaySpeedIdx--;return;}
    if(e.key==='ArrowDown'){if(replaySpeedIdx<REPLAY_SPEEDS.length-1)replaySpeedIdx++;return;}
    if(e.key==='t'||e.key==='T'){replayTakeover();return;}
  }
  if(e.key==='n'||e.key==='N'){
    if(phase===Phase.GAME_OVER||phase===Phase.PLAYING){
      if(ws&&wsRole!=='local')netSend({type:'new_game'});
      replayCorpus=null;replayMode=false;replayTakeoverPly=null;
      resetGame();phase=Phase.LOBBY;
    }
  }
  if(e.key==='t'||e.key==='T'){
    if(!replayMode){
      const idx=(THEME_ORDER.indexOf(currentTheme)+1)%THEME_ORDER.length;
      applyTheme(THEME_ORDER[idx]);
    }
  }
  if(e.key==='k'||e.key==='K'){
    kibOn=!kibOn;
    addLog(`Kibitzer ${kibOn?'ON':'OFF'}`);
  }
  if(phase===Phase.LOBBY){
    if(e.key==='ArrowDown')lobbySelected=(lobbySelected+1)%3;
    if(e.key==='ArrowUp')lobbySelected=(lobbySelected+2)%3;
    if(e.key==='Enter')lobbySelect(lobbySelected);
  }
});

// ── Corpus replay mode ───────────────────────────────────────────────────────
let replayCorpus=null, replayPly=0, replayMode=false, replayPaused=true;
let replayDelayMs=500, replayLastMs=0, replayTakeoverPly=null;
const REPLAY_SPEEDS=[100,200,350,500,750,1000,1500,2000];
let replaySpeedIdx=3;

function initReplay(corpus){
  resetGame();
  replayCorpus=corpus;
  replayPly=0;
  replayMode=true;
  replayPaused=true;
  replayTakeoverPly=null;
  replaySpeedIdx=3;
  const c=corpus.team_r_rgb;
  teamR=new Team(c[0],c[1],c[2],'Right');
  const d=corpus.team_l_rgb;
  teamL=new Team(d[0],d[1],d[2],'Left');
  computerR=false;computerL=false;
  initBoard();
  currentTeam=teamR;
  phase=Phase.PLAYING;
  beginTurn(currentTeam);
  addLog(`Corpus loaded: ${corpus.moves.length} moves`);
  addLog(`Failure at ply ${corpus.failure.ply} (${corpus.failure.kind||'?'})`);
  addLog('Space=play/pause  ←→=step  T=takeover');
}

function replayStepForward(){
  if(!replayCorpus||replayPly>=replayCorpus.moves.length){replayPaused=true;return;}
  const m=replayCorpus.moves[replayPly];
  // Clear en passant on current team
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=grid[r][c];
    if(p instanceof Pawn&&p.team.r===currentTeam.r)p.enPassantable=false;
  }
  const capture=grid[m.tr][m.tc];
  grid[m.tr][m.tc]=grid[m.fr][m.fc];
  applyMove(m.fr,m.fc,m.tr,m.tc);
  moveCount++;
  replayPly++;
  // Update peace time
  const flags=m.flags||{};
  if(flags.is_capture||grid[m.tr][m.tc] instanceof Pawn)peaceTime=0;
  else peaceTime++;
  nextTurn();
}

function replayToTarget(target){
  // Re-init and replay to target ply
  initBoard();
  currentTeam=teamR;moveCount=0;peaceTime=0;replayPly=0;
  inCheck=false;selectedPiece=null;
  for(let i=0;i<target&&replayPly<replayCorpus.moves.length;i++){
    const m=replayCorpus.moves[replayPly];
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){
      const p=grid[r][c];
      if(p instanceof Pawn&&p.team.r===currentTeam.r)p.enPassantable=false;
    }
    grid[m.tr][m.tc]=grid[m.fr][m.fc];
    applyMove(m.fr,m.fc,m.tr,m.tc);
    moveCount++;
    replayPly++;
    const flags=m.flags||{};
    if(flags.is_capture||grid[m.tr][m.tc] instanceof Pawn)peaceTime=0;
    else peaceTime++;
    currentTeam=currentTeam===teamR?teamL:teamR;
  }
  beginTurn(currentTeam);
}

function replayTakeover(){
  replayMode=false;
  replayTakeoverPly=replayPly;
  selectedPiece=null;
  addLog(`Takeover at ply ${replayPly} — human play begins`);
}

// Replay panel info (injected into renderPanel)
function replayPanelHtml(){
  if(!replayCorpus)return '';
  let html='';
  const total=replayCorpus.moves.length;
  const fp=replayCorpus.failure.ply;
  if(replayMode){
    const st=replayPaused?'PAUSED':'PLAYING';
    html+=`<div class="p-label">Replay</div><div class="p-val accent">${st}</div>`;
    html+=`<div class="p-val">Ply ${replayPly}/${total}  ·  ${REPLAY_SPEEDS[replaySpeedIdx]}ms</div>`;
    if(replayPly>0&&replayPly<=total){
      const m=replayCorpus.moves[replayPly-1];
      const f=m.flags||{};
      let fl=[];
      if(f.is_capture)fl.push('capture');
      if(f.is_en_passant)fl.push('e.p.');
      if(f.is_castling)fl.push('castle');
      if(f.is_promotion)fl.push('promo');
      html+=`<div class="p-val" style="font-size:11px">(${m.fr},${m.fc})→(${m.tr},${m.tc}) ${fl.join(' ')}</div>`;
    }
    if(replayPly===fp)html+=`<div class="p-alert check">▶▶ FAILURE PLY (${replayCorpus.failure.kind||'?'})</div>`;
    else if(replayPly>fp)html+=`<div class="p-val" style="color:#c06060;font-size:11px">(past failure ply)</div>`;
    html+=`<div style="margin-top:8px;font-size:10px;color:#3a5060">Space=play/pause ←→=step ↑↓=speed T=takeover</div>`;
  } else if(replayTakeoverPly!=null){
    html+=`<div class="p-label">Replay</div><div class="p-val" style="color:#60ff80">TAKEOVER from ply ${replayTakeoverPly}</div>`;
    html+=`<div class="p-val" style="font-size:11px">Failure was at ply ${fp}</div>`;
  }
  return html;
}

// File-drop and file-input for loading corpus
function handleCorpusFile(file){
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const corpus=JSON.parse(e.target.result);
      if(corpus.version!==1||!corpus.moves||!corpus.failure){
        addLog('Invalid corpus file');return;
      }
      initReplay(corpus);
    }catch(err){addLog('Failed to parse corpus: '+err.message);}
  };
  reader.readAsText(file);
}

// Drag and drop
document.addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('drop',function(e){
  e.preventDefault();
  if(e.dataTransfer.files.length>0){
    const f=e.dataTransfer.files[0];
    if(f.name.endsWith('.corpus.json'))handleCorpusFile(f);
  }
});

// URL-based replay: sim.html?replay=path
if(typeof URLSearchParams!=='undefined'&&typeof window!=='undefined'){
  (function(){
    const params=new URLSearchParams(window.location.search);
    const replayUrl=params.get('replay');
    if(replayUrl){
      fetch(replayUrl).then(r=>r.json()).then(corpus=>{
        if(corpus.version===1&&corpus.moves&&corpus.failure)initReplay(corpus);
        else addLog('Invalid corpus file from URL');
      }).catch(err=>addLog('Failed to load corpus: '+err.message));

  })();
}

function _stlGeoFromB64(b64){
  const bin=atob(b64),buf=new ArrayBuffer(bin.length),bytes=new Uint8Array(buf);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  let geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(buf),3));
  if(THREE.BufferGeometryUtils)geo=THREE.BufferGeometryUtils.mergeVertices(geo,1e-4);
  geo.computeVertexNormals();return geo;
}
function _loadStlPieces(){
  if(!three)return;
  const mat=()=>new THREE.MeshStandardMaterial({metalness:0.4,roughness:0.35,emissiveIntensity:0.55});
  for(const ptype of Object.keys(STL_DATA)){
    const geo=_stlGeoFromB64(STL_DATA[ptype]);
    for(const m of three.pool){
      if(m.userData.ptype!==ptype)continue;
      while(m.children.length)m.remove(m.children[0]);
      m.add(new THREE.Mesh(geo,mat()));
    }
    if(three.animMesh.userData.ptype===ptype){
      while(three.animMesh.children.length)three.animMesh.remove(three.animMesh.children[0]);
      three.animMesh.add(new THREE.Mesh(geo,mat()));
    }
  }
}
function _tc(team){return new THREE.Color(team.r/255,team.g/255,team.b/255);}

// Build a single piece Group for the pool (no team assigned yet)
function _makePieceMesh(type){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({metalness:0.35,roughness:0.4,emissiveIntensity:0.5});
  const add=(geo,yOff)=>{const m=new THREE.Mesh(geo,mat.clone());m.position.y=yOff;g.add(m);};
  if(type==='Pawn'){
    add(new THREE.CylinderGeometry(0.13,0.18,0.12,64),0.06);
    add(new THREE.SphereGeometry(0.17,40,24),0.28);
  } else if(type==='Rook'){
    add(new THREE.CylinderGeometry(0.20,0.23,0.42,64),0.21);
    add(new THREE.CylinderGeometry(0.23,0.23,0.08,64),0.46);
  } else if(type==='Knight'){
    add(new THREE.CylinderGeometry(0.17,0.22,0.16,64),0.08);
    const head=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.28,0.16),mat.clone());
    head.position.set(0.04,0.38,0);head.rotation.x=-0.4;g.add(head);
  } else if(type==='Bishop'){
    add(new THREE.CylinderGeometry(0.14,0.20,0.52,64),0.26);
    add(new THREE.SphereGeometry(0.12,32,18),0.58);
    add(new THREE.ConeGeometry(0.04,0.10,64),0.73);
  } else if(type==='Queen'){
    add(new THREE.CylinderGeometry(0.20,0.26,0.62,64),0.31);
    const torus=new THREE.Mesh(new THREE.TorusGeometry(0.18,0.04,20,64),mat.clone());
    torus.position.y=0.66;torus.rotation.x=Math.PI/2;g.add(torus);
    add(new THREE.SphereGeometry(0.10,32,18),0.80);
  } else { // King
    add(new THREE.CylinderGeometry(0.20,0.26,0.70,64),0.35);
    add(new THREE.BoxGeometry(0.08,0.24,0.08),0.87);
    add(new THREE.BoxGeometry(0.22,0.08,0.08),0.90);
  }
  g.visible=false;
  return g;
}

// Paint piece meshes white (teamR) or dark polished metal (teamL).
// Board LED emissive carries team colors; pieces stay neutral but remain visible.
function _tintGroup(grp,team){
  const isR=teamR&&team.r===teamR.r; // red channel is unique per team (BUG-03 safe)
  // White: ivory ceramic.  Dark: near-black polished metal (high metalness catches scene lights)
  const col=isR?new THREE.Color(0.90,0.90,0.87):new THREE.Color(0.18,0.18,0.22);
  const emi=isR?new THREE.Color(0.15,0.15,0.13):new THREE.Color(0.04,0.04,0.06);
  const metalness=isR?0.15:0.85;
  const roughness=isR?0.50:0.08;
  grp.traverse(ch=>{
    if(ch.isMesh){
      ch.material.color=col.clone();ch.material.emissive=emi.clone();
      ch.material.emissiveIntensity=1.0;
      ch.material.metalness=metalness;ch.material.roughness=roughness;
    }
  });
}

function initThree(){
  const canvas3d=document.getElementById('board3d');
  // Use actual CSS display size so the renderer matches the layout on any screen
  const W=canvas3d.clientWidth||640;
  const H=canvas3d.clientHeight||640;
  const renderer=new THREE.WebGLRenderer({canvas:canvas3d,antialias:true,alpha:true});
  // setSize(w,h,false) — sets WebGL resolution but does NOT override canvas CSS size
  renderer.setSize(W,H,false);renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setClearColor(0x000000,0); // transparent — CSS gradient on #board3d shows through

  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(50,W/H,0.1,100);
  camera.position.set(3.5,9,13);camera.lookAt(3.5,0,3.5);

  const controls=new THREE.OrbitControls(camera,canvas3d);
  controls.target.set(3.5,0,3.5);
  controls.minDistance=5;controls.maxDistance=20;
  controls.maxPolarAngle=Math.PI*0.78;controls.enablePan=false;
  controls.update();

  // Lighting
  const ambientLight=new THREE.AmbientLight(0x2a3050,1.2);scene.add(ambientLight);
  const dir=new THREE.DirectionalLight(0xffffff,1.2);
  dir.position.set(4,12,8);scene.add(dir);
  // Fill light from camera-side so dark pieces catch specular highlights
  const fill=new THREE.DirectionalLight(0xffffff,0.5);fill.position.set(4,6,16);scene.add(fill);
  const ptR=new THREE.PointLight(0xffffff,0.8,14);ptR.position.set(3.5,3,0);scene.add(ptR);
  const ptL=new THREE.PointLight(0xffffff,0.8,14);ptL.position.set(3.5,3,7);scene.add(ptL);

  // Board frame
  const frame=new THREE.Mesh(
    new THREE.BoxGeometry(9.0,0.10,9.0),
    new THREE.MeshStandardMaterial({color:0x030508,metalness:0.2,roughness:0.8})
  );
  frame.position.set(3.5,-0.04,3.5);scene.add(frame);

  // Board squares
  const boardSquares=[];
  const sqGeo=new THREE.BoxGeometry(0.88,0.06,0.88);
  for(let r=0;r<8;r++){
    boardSquares[r]=[];
    for(let c=0;c<8;c++){
      const dark=(r+c)%2===1;
      const mat=new THREE.MeshStandardMaterial({
        color:dark?0x0a0e16:0x141e2c,
        emissive:dark?0x0a0e16:0x141e2c,
        emissiveIntensity:0.05,
        roughness:0.8,metalness:0.1
      });
      const sq=new THREE.Mesh(sqGeo,mat);
      sq.position.set(c,0,r);
      sq.userData={row:r,col:c,darkBase:dark};
      scene.add(sq);boardSquares[r][c]=sq;
    }
  }

  // Piece pool: 6 types × 2 copies per type (need up to 16 per side, so create enough)
  const TYPES=['Pawn','Rook','Knight','Bishop','Queen','King'];
  const pool=[];
  // 2 rooks/knights/bishops, 8 pawns, 1 queen, 1 king per side × 2 sides = 32
  const counts={Pawn:16,Rook:4,Knight:4,Bishop:4,Queen:2,King:2};
  for(const t of TYPES){
    for(let i=0;i<counts[t];i++){
      const m=_makePieceMesh(t);
      m.userData.ptype=t;
      scene.add(m);pool.push(m);
    }
  }

  // Animation mesh (single extra piece for arc animation)
  const animMesh=_makePieceMesh('Pawn'); // type overridden at runtime
  animMesh.userData.ptype='Pawn';
  scene.add(animMesh);

  // Ghost mesh — shown during AI thinking at the candidate TO square, semi-transparent
  const ghostMesh=_makePieceMesh('Pawn');
  ghostMesh.userData.ptype='Pawn';
  ghostMesh.visible=false;
  scene.add(ghostMesh);

  three={scene,camera,renderer,controls,boardSquares,pool,animMesh,ghostMesh,lights:{ptR,ptL},ambientLight};
  _loadStlPieces(); // replace geometric primitives with STL meshes (also updates ghostMesh via ptype match on first use)

  // Resize handler — keeps renderer resolution synced with CSS layout on orientation change etc.
  function onResize(){
    if(!three)return;
    const el=document.getElementById('board3d');
    const w=el.clientWidth,h=el.clientHeight;
    if(w>0&&h>0){
      three.renderer.setSize(w,h,false);
      three.camera.aspect=w/h;
      three.camera.updateProjectionMatrix();
    }
  }
  window.addEventListener('resize',onResize);
}

function _hex(team){
  return(team.r<<16)|(team.g<<8)|team.b;
}

// Read the already-populated LED pixel buffer and apply colors to 3D board squares.
// This automatically picks up ALL phases (lobby, color-pick, war-games, playing, game-over)
// with zero logic duplication — whatever lightCell() painted is what the 3D board shows.
function updateBoardEmissiveFromBuf(){
  if(!three)return;
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      let sr=0,sg=0,sb=0;
      for(let i=0;i<4;i++)for(let j=0;j<4;j++){
        const[lr,lg,lb]=getPixel(c*4+j,r*4+i);
        sr+=lr;sg+=lg;sb+=lb;
      }
      // Average of 16 pixels → cell color
      const col=new THREE.Color(sr/16/255,sg/16/255,sb/16/255);
      three.boardSquares[r][c].material.emissive=col;
      three.boardSquares[r][c].material.emissiveIntensity=1.0;
    }
  }
}

function syncPieceMeshes(){
  if(!three||!grid)return;
  // Hide all pool meshes and ghost first
  for(const m of three.pool)m.visible=false;
  three.animMesh.visible=false;
  three.ghostMesh.visible=false;

  // Animating piece destination — skip that cell
  const animDest=animPieces.length?[animPieces[0].toR,animPieces[0].toC]:null;

  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const p=grid[r][c];if(!p)continue;
      if(animDest&&animDest[0]===r&&animDest[1]===c)continue; // drawn by animMesh
      const typeName=p.constructor.name;
      // Scan full pool for any unused mesh of this type
      let mesh=null;
      for(const m of three.pool){if(!m.visible&&m.userData.ptype===typeName){mesh=m;break;}}
      if(!mesh)continue; // pool exhausted (promotion edge case)
      _tintGroup(mesh,p.team);
      mesh.position.set(c,0.03,r);
      mesh.visible=true;
    }
  }

  // Ghost piece — semi-transparent at candidate TO square during AI thinking
  if(aiThinking&&aiCurrentCandidate){
    const{fr,fc,tr,tc}=aiCurrentCandidate;
    const p=grid[fr]&&grid[fr][fc];
    if(p){
      const typeName=p.constructor.name;
      if(three.ghostMesh.userData.ptype!==typeName){
        three.ghostMesh.userData.ptype=typeName;
        while(three.ghostMesh.children.length)three.ghostMesh.remove(three.ghostMesh.children[0]);
        const geo=STL_DATA[typeName]?_stlGeoFromB64(STL_DATA[typeName]):null;
        const mat=new THREE.MeshStandardMaterial({
          transparent:true,opacity:0.40,depthWrite:false,
          metalness:0.3,roughness:0.4,emissiveIntensity:0.9
        });
        if(geo)three.ghostMesh.add(new THREE.Mesh(geo,mat));
      }
      // Tint ghost with raw team color so it reads as "that team's piece"
      const col=_tc(p.team);
      three.ghostMesh.traverse(ch=>{
        if(ch.isMesh){ch.material.emissive=col.clone();ch.material.color=col.clone();}
      });
      three.ghostMesh.position.set(tc,0.03,tr);
      three.ghostMesh.visible=true;
    }
  }

  // Animate piece
  if(animPieces.length>0){
    const a=animPieces[0];
    const p=a.piece;
    if(p){
      const typeName=p.constructor.name;
      if(three.animMesh.userData.ptype!==typeName){
        three.animMesh.userData.ptype=typeName;
        while(three.animMesh.children.length)three.animMesh.remove(three.animMesh.children[0]);
        if(STL_DATA[typeName]){
          const mat=new THREE.MeshStandardMaterial({metalness:0.4,roughness:0.35,emissiveIntensity:0.55});
          three.animMesh.add(new THREE.Mesh(_stlGeoFromB64(STL_DATA[typeName]),mat));
        } else {
          const fresh=_makePieceMesh(typeName);
          for(const ch of [...fresh.children]){fresh.remove(ch);three.animMesh.add(ch);}
        }
      }
      _tintGroup(three.animMesh,p.team);
      // Position computed in updateAnimMesh
      three.animMesh.visible=true;
    }
  }
}

function updateAnimMesh(now){
  if(!animPieces.length||!three)return;
  const a=animPieces[0];
  const prog=Math.min(1,(now-a.startMs)/ANIM_MS);
  const t=1-(1-prog)**2;
  const x=a.fromC+(a.toC-a.fromC)*t;
  const z=a.fromR+(a.toR-a.fromR)*t;
  const y=0.03+Math.sin(prog*Math.PI)*1.5;
  three.animMesh.position.set(x,y,z);
}

function updateTeamLights(){
  if(!three||!teamR||!teamL)return;
  three.lights.ptR.color=_tc(teamR);
  three.lights.ptL.color=_tc(teamL);
}

function renderThree(now){
  if(!three){
    if(!threeInited&&typeof THREE!=='undefined'){initThree();threeInited=true;}
    if(!three)return;
  }
  // ChessMatrix scan mode: position camera for easy scanning
  const wantScanMode=netPhase==='waiting_peer'&&roomCode;
  if(wantScanMode&&!scanModeActive){
    savedCamPos=three.camera.position.clone();
    savedCamTarget=three.controls.target.clone();
    three.camera.position.set(3.5,12,3.5);
    three.controls.target.set(3.5,0,3.5);
    three.controls.update();
    scanModeActive=true;
  } else if(!wantScanMode&&scanModeActive){
    if(savedCamPos)three.camera.position.copy(savedCamPos);
    if(savedCamTarget)three.controls.target.copy(savedCamTarget);
    three.controls.update();
    scanModeActive=false;
  }
  updateBoardEmissiveFromBuf();
  if(phase===Phase.PLAYING){
    syncPieceMeshes();
    updateAnimMesh(now);
  } else {
    for(const m of three.pool)m.visible=false;
    three.animMesh.visible=false;
  }
  updateTeamLights();
  three.controls.update();
  three.renderer.render(three.scene,three.camera);
}

// Click / touch on the 3D canvas
(function(){
  const c3=document.getElementById('board3d');
  function pick3d(clientX,clientY){
    if(!three)return;
    const rect=c3.getBoundingClientRect();
    const mouse=new THREE.Vector2(
      ((clientX-rect.left)/rect.width)*2-1,
      -((clientY-rect.top)/rect.height)*2+1
    );
    const ray=new THREE.Raycaster();
    ray.setFromCamera(mouse,three.camera);
    const hits=ray.intersectObjects(three.boardSquares.flat());
    if(hits.length){
      const{row,col}=hits[0].object.userData;
      // Synthetic 2D pixel coords so handleClick dispatches to the right phase handler
      handleClick(col*CELL_PX+CELL_PX/2, row*CELL_PX+CELL_PX/2);
    }
  }
  c3.addEventListener('click',e=>pick3d(e.clientX,e.clientY));
  c3.addEventListener('touchstart',function(e){
    // Single-tap triggers click; multi-touch goes to OrbitControls
    if(e.touches.length===1){
      e.preventDefault();
      pick3d(e.touches[0].clientX,e.touches[0].clientY);
    }
  },{passive:false});
})();

// ── Animation loop ────────────────────────────────────────────────────────────
let lastPanelMs=0;
function frame(now){
  // Auto-advance replay
  if(replayMode&&!replayPaused&&replayCorpus){
    if(now-replayLastMs>=REPLAY_SPEEDS[replaySpeedIdx]){
      if(replayPly<replayCorpus.moves.length){replayStepForward();replayLastMs=now;}
      else replayPaused=true;
    }
  }
  render(now);
  renderReactions(now);
  if(now-lastPanelMs>100){renderPanel();lastPanelMs=now;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── Initial log ───────────────────────────────────────────────────────────────
addLog('Chess101 Browser Simulator');
addLog('Select a mode to begin.');
</script>
