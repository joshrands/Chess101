# Nginx configuration for chess101.net
# Terminates TLS and proxies WebSocket connections to the relay server.
#
# Place at: /etc/nginx/sites-available/chess101
# Enable:   ln -s /etc/nginx/sites-available/chess101 /etc/nginx/sites-enabled/
# Reload:   nginx -t && systemctl reload nginx

# Redirect all plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chess101.net www.chess101.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chess101.net www.chess101.net;

    # TLS certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/chess101.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess101.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # WebSocket relay — wss://chess101.net/  (or any path)
    location / {
        proxy_pass          http://127.0.0.1:8765;
        proxy_http_version  1.1;

        # Required for WebSocket upgrade
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";

        # Forward real client IP
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

        # Keep long-lived WebSocket connections alive
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Serve the browser spectator page at /spectate
    location /spectate {
        alias /var/www/chess101/web/spectator.html;
        default_type text/html;
    }
}
