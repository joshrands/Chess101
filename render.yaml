services:
  - type: web
    name: chess101-relay
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.relay
    healthCheckPath: /health
    # Set RELAY_PORT, RELAY_MAX_ROOMS, RELAY_ROOM_TIMEOUT in the Render dashboard.
    # See deploy/DEPLOY.md for required values and custom domain (relay.chess101.net) setup.

  - type: web
    name: chess101-spectator
    env: static
    buildCommand: ""
    staticPublishPath: ./web
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    # See deploy/DEPLOY.md for custom domain (chess101.net) and DNS setup.
